<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>New tab · Creyium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --black: #000;
      --top: #050505;
      --toolbar: #080808;
      --tab-active: #171717;
      --field: #19191b;
      --field-hover: #202023;
      --hover: rgba(255,255,255,.065);
      --text: #ededf0;
      --muted: #a0a0a7;
      --subtle: #68686e;
      --accent: #a9c1ff;
      --ease: cubic-bezier(.2,.8,.2,1);
      --quick: 120ms;
      --normal: 190ms;
      --font: 'Manrope', 'Avenir Next', 'Lato', 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { color: var(--text); background: var(--black); font-family: var(--font); font-size: 13px; overflow: hidden; }
    button, input { font: inherit; }
    button { appearance: none; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, [role="tab"]:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(190,200,230,.5);
    }
    [hidden] { display: none !important; }
    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    .tabstrip { flex: 0 0 43px; display: flex; align-items: flex-end; gap: 6px; padding: 0 12px; background: var(--top); user-select: none; }
    .tablist { height: 100%; display: flex; align-items: flex-end; gap: 4px; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .tablist::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; height: 35px; min-width: 104px; width: 226px; max-width: 226px; flex: 0 1 226px;
      display: flex; align-items: center; gap: 10px; background: transparent; border: 0;
      border-radius: 10px 10px 0 0; padding: 0 7px 0 13px;
      color: #87878f; cursor: pointer; white-space: nowrap; text-align: left;
      transition: background var(--normal) var(--ease), color var(--quick) ease;
    }
    .tab.active { background: var(--tab-active); color: #f0f0f3; }
    .tab:not(.active):hover { background: rgba(255,255,255,.035); color: #c9c9cd; }
    .tab.is-closing { animation: tab-out 135ms ease-in both; pointer-events: none; }
    .tab-icon { width: 15px; height: 15px; flex: 0 0 15px; color: #a6a6ac; }
    .tab-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; font-weight: 650; letter-spacing: -.01em; }
    .tab-close { width: 23px; height: 23px; flex: 0 0 23px; border: 0; border-radius: 7px; background: transparent; color: #a7a7ae; display: grid; place-items: center; cursor: pointer; transition: background var(--quick), color var(--quick), transform var(--quick) var(--ease); }
    .tab-close:hover { background: rgba(255,255,255,.08); color: #fff; }
    .new-tab { width: 31px; height: 31px; flex: 0 0 31px; border: 0; border-radius: 9px; margin-bottom: 5px; background: transparent; color: #b5b5ba; cursor: pointer; display: grid; place-items: center; transition: background var(--quick), color var(--quick), transform var(--quick) var(--ease); }
    .new-tab:hover { background: var(--hover); color: #f2f2f2; }
    .toolbar { z-index: 2; height: 51px; flex: 0 0 51px; display: flex; align-items: center; gap: 6px; padding: 0 13px; background: var(--toolbar); border-bottom: 1px solid #1b1b1c; user-select: none; }
    .action { width: 33px; height: 33px; flex: 0 0 33px; display: grid; place-items: center; border: 0; border-radius: 10px; color: #bdbdc3; background: transparent; cursor: pointer; transition: background var(--quick), color var(--quick), transform var(--quick) var(--ease); }
    .action:hover:not(:disabled) { background: var(--hover); color: #fff; }
    .action:disabled { color: #434348; cursor: default; }
    .action:active:not(:disabled), .tab-close:active, .menu-item:active { transform: scale(.94); }
    .new-tab:active { background: rgba(255,255,255,.085); }
    .addressbox {
      height: 37px; margin: 0 5px 0 7px; min-width: 50px; flex: 1; background: var(--field);
      border: 0; border-radius: 999px;
      display: flex; align-items: center; gap: 10px; padding: 0 15px;
      transition: background var(--normal) var(--ease), box-shadow var(--normal) var(--ease);
    }
    .addressbox:hover { background: var(--field-hover); }
    .addressbox:focus-within { background: #222225; box-shadow: inset 0 0 0 1px rgba(188,197,218,.25); }
    .site-indicator { color: #8b8b94; width: 16px; height: 16px; flex: 0 0 16px; display: flex; align-items: center; justify-content: center; }
    #address { display: block; height: 100%; width: 100%; min-width: 0; flex: 1; border: 0; background: transparent; outline: none; color: #f1f1f3; font-size: 12px; font-weight: 600; letter-spacing: -.012em; }
    #address::placeholder { color: #9a9aa1; opacity: 1; }
    #address::selection { background: #485368; color: white; }
    .more { margin-left: 1px; }
    .icon { width: 17px; height: 17px; stroke-width: 1.8; flex-shrink: 0; display: inline-block; }
    .tab .icon { width: 15px; height: 15px; }
    .tab-close .icon { width: 14px; height: 14px; stroke-width: 2; }
    .viewport { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--black); }
    .guest-intro { max-width: 490px; padding: clamp(92px, 13vh, 148px) 20px 70px; margin: 0 auto; animation: content-in 260ms var(--ease) both; }
    .eyebrow { color: #8c8c95; text-transform: uppercase; letter-spacing: .15em; font-size: 10px; font-weight: 800; margin: 0 0 22px; display: flex; gap: 9px; align-items: center; }
    .eyebrow .icon { width: 14px; height: 14px; }
    h1 { font-size: clamp(24px, 2.6vw, 33px); font-weight: 650; letter-spacing: -.047em; margin: 0 0 15px; line-height: 1.23; color: #f0f0f1; }
    .intro-copy { margin: 0; max-width: 410px; color: #8f8f98; font-size: 13px; line-height: 1.85; font-weight: 500; }
    .preview-state { max-width: 460px; margin: clamp(90px, 14vh, 160px) auto 0; padding: 0 20px; animation: content-in 240ms var(--ease) both; }
    .preview-state h2 { margin: 0 0 12px; font-size: 25px; font-weight: 650; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .preview-state p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .popover {
      position: fixed; z-index: 20; top: 89px; right: 11px; width: 226px; border: 0;
      border-radius: 13px; padding: 6px; color: #dedee2; background: #1b1b1e;
      box-shadow: 0 12px 36px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.055);
      opacity: 0; transform: translateY(-7px) scale(.985); transform-origin: 100% 0;
      pointer-events: none; visibility: hidden;
      transition: opacity 160ms var(--ease), transform 160ms var(--ease), visibility 160ms;
    }
    .popover.is-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; visibility: visible; }
    .menu-item { width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 11px; background: transparent; color: #d2d2d8; border: 0; border-radius: 8px; text-align: left; font-weight: 600; font-size: 11px; cursor: pointer; transition: background var(--quick) ease, color var(--quick) ease, transform var(--quick) var(--ease); }
    .menu-item:hover { background: rgba(255,255,255,.075); color: #fff; }
    .menu-item .icon { color: #9a9aa2; width: 15px; height: 15px; }
    .menu-rule { margin: 5px 6px; height: 1px; background: rgba(255,255,255,.085); }
    @keyframes tab-out { to { opacity: 0; transform: translateY(4px) scale(.98); } }
    @keyframes content-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media(max-width: 700px) {
      .tabstrip { padding-left: 7px; }
      .tab { width: 178px; min-width: 98px; }
      .toolbar { padding: 0 7px; gap: 2px; }
      .action { width: 32px; flex-basis: 32px; }
      .addressbox { margin: 0 3px; padding: 0 12px; }
      .guest-intro { padding-top: 80px; }
    }
    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
    }

/* Tabs stay visually aligned with the add button. */
.new-tab { margin-bottom: 2px; align-self: flex-end; }
.tab { user-select: none; -webkit-user-select: none; }
.tab[draggable="true"] { -webkit-user-drag: element; }
.tab.is-dragging { opacity: .42; }
.tab.drag-before::before, .tab.drag-after::after { content: ""; position: absolute; top: 6px; bottom: 5px; width: 2px; border-radius: 2px; background: #a9c1ff; }
.tab.drag-before::before { left: -3px; }
.tab.drag-after::after { right: -3px; }
.tab.pinned { flex: 0 0 55px; width: 55px; min-width: 55px; max-width: 55px; padding: 0 6px; justify-content: center; }
.tab.pinned .tab-name { display: none; }
.tab.pinned .tab-close { display: none; }
.tab.grouped::after { content: ""; position: absolute; left: 12px; right: 12px; height: 2px; border-radius: 2px; bottom: 1px; background: var(--group-color, #a9c1ff); opacity: .8; }
.tab.muted .tab-icon { opacity: .45; }
/* Common menu treatment for right-click menus and existing overflow menu. */
.context-menu { position: fixed; z-index: 40; width: 264px; padding: 5px; border-radius: 10px; background: #1d1d1f; color: #ebebee; box-shadow: 0 16px 50px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.055); opacity: 0; transform: translateY(-5px) scale(.99); transform-origin: top left; pointer-events: none; visibility: hidden; transition: opacity 135ms var(--ease), transform 135ms var(--ease), visibility 135ms; }
.context-menu { max-height: calc(100dvh - 16px); overflow-y: auto; }
.context-menu.is-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; visibility: visible; }
.context-option { display: flex; width: 100%; height: 32px; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; border: 0; background: transparent; border-radius: 5px; color: #ebebed; text-align: left; font-size: 12px; font-weight: 550; cursor: pointer; }
.context-option:hover:not(:disabled), .context-option:focus-visible:not(:disabled) { background: #323235; outline: none; }
.context-option:disabled { color: #72727b; cursor: default; }
.context-key { color: #9898a1; font-size: 10.5px; font-weight: 500; white-space: nowrap; }
.context-separator { height: 1px; background: #353538; margin: 5px 2px; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: 22px; transform: translate(-50%,6px); pointer-events: none; background: #27272a; color: #e5e5e7; border-radius: 8px; padding: 10px 15px; font-size: 12px; font-weight: 550; box-shadow: 0 8px 30px rgba(0,0,0,.45); opacity: 0; transition: opacity 170ms ease, transform 170ms var(--ease); }
.toast.visible { opacity: 1; transform: translate(-50%,0); }
/* Optional split-view & vertical-tab actions are working UI demonstrations. */
.viewport.split { display: flex; overflow: hidden; }
.split-pane { flex: 1; min-width: 0; overflow: auto; position: relative; }
.split-pane + .split-pane { box-shadow: inset 1px 0 0 #252528; }
.split-pane .guest-intro, .split-pane .preview-state { max-width: 460px; }
.app.vertical { display: grid; grid-template-columns: 212px minmax(0,1fr); grid-template-rows: 51px minmax(0,1fr); }
.app.vertical .tabstrip { grid-column: 1; grid-row: 1 / span 2; height: auto; min-height: 0; flex: none; flex-direction: column; align-items: stretch; padding: 9px 7px; gap: 7px; box-shadow: inset -1px 0 0 #212124; }
.app.vertical .tablist { flex: 1; flex-direction: column; align-items: stretch; gap: 3px; width: 100%; overflow-y: auto; overflow-x: hidden; }
.app.vertical .tab { flex: 0 0 35px; max-width: none; width: 100%; min-width: 0; height: 35px; border-radius: 8px; }
.app.vertical .tab.pinned { width: 100%; flex-basis: 35px; justify-content: flex-start; }
.app.vertical .new-tab { align-self: flex-start; margin: 0 0 0 5px; }
.app.vertical .toolbar { grid-column: 2; grid-row: 1; }
.app.vertical .viewport { grid-column: 2; grid-row: 2; }
@media(max-width: 600px) { .context-menu { max-width: calc(100vw - 16px); } .app.vertical { grid-template-columns: 148px minmax(0,1fr); } .app.vertical .tab { padding-left: 8px; } .app.vertical .tab-name { font-size: 10px; } }
@media print { .tabstrip, .toolbar, .popover, .context-menu, .toast { display: none !important; } .app { display: block; height: auto; } .viewport { overflow: visible; background: #fff; color: #111; } .viewport * { color: #111 !important; } }

  </style>
</head>
<body>
  <!-- Lucide SVG icon set, with a compact embedded fallback sprite for offline viewing.
       Online: official Lucide UMD library renders every data-lucide icon.
       Offline: these matching Lucide symbols keep the standalone prototype usable. -->
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="ico-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="ico-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="ico-refresh-cw" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3.9L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.9L21 15"/><path d="M16 15h5v5"/></symbol>
    <symbol id="ico-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="ico-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="ico-ellipsis-vertical" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="ico-user-round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></symbol>
    <symbol id="ico-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10"/></symbol>
    <symbol id="ico-panel-top" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></symbol>
    <symbol id="ico-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  </svg>

  <div class="app" id="app">
    <header class="tabstrip" aria-label="Creyium tabs">
      <div class="tablist" id="tablist" role="tablist" aria-label="Browser tabs"></div>
      <button type="button" class="new-tab" id="new-tab" title="New tab" aria-label="New tab"><i data-lucide="plus"></i></button>
    </header>
    <nav class="toolbar" aria-label="Browser navigation">
      <button class="action" id="back" title="Back" aria-label="Back" disabled><i data-lucide="arrow-left"></i></button>
      <button class="action" id="forward" title="Forward" aria-label="Forward" disabled><i data-lucide="arrow-right"></i></button>
      <button class="action" id="reload" title="Reload" aria-label="Reload"><i data-lucide="refresh-cw"></i></button>
      <form id="address-form" class="addressbox" autocomplete="off" role="search">
        <span class="site-indicator" aria-hidden="true"><i data-lucide="globe"></i></span>
        <input id="address" name="address" aria-label="Address or search" type="text" inputmode="url" spellcheck="false" autocomplete="off" placeholder="Search or enter a URL">
      </form>
      <button class="action more" id="more" title="More options" aria-label="More options" aria-expanded="false"><i data-lucide="ellipsis-vertical"></i></button>
    </nav>
    <main class="viewport" id="viewport">
      <section class="guest-intro" id="guest-home">
        <p class="eyebrow"><i data-lucide="user-round"></i> Guest session</p>
        <h1>You're browsing as a guest.</h1>
        <p class="intro-copy">Tabs and browsing history in this preview are temporary. Close the page to start fresh next time.</p>
      </section>
    </main>
    <div class="popover" id="popover" role="menu" aria-label="Browser menu" aria-hidden="true" inert>
      <button type="button" class="menu-item" data-action="new"><i data-lucide="plus"></i>New tab</button>
      <button type="button" class="menu-item" data-action="close"><i data-lucide="x"></i>Close tab</button>
      <button type="button" class="menu-item" data-action="fullscreen"><i data-lucide="expand"></i>Fullscreen</button>
      <div class="menu-rule"></div>
      <button type="button" class="menu-item" data-action="reset"><i data-lucide="refresh-cw"></i>Reset tabs</button>
    </div>

    <div class="context-menu" id="context-menu" role="menu" aria-label="Context menu" aria-hidden="true" inert></div>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const app = $('app'), tablist = $('tablist'), viewport = $('viewport');
    const address = $('address'), menu = $('context-menu'), popover = $('popover'), toast = $('toast');
    const buttons = { back: $('back'), forward: $('forward'), reload: $('reload'), more: $('more') };
    const guestHtml = viewport.innerHTML;
    const noMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let tabs = [], activeId = 0, nextId = 1;
    let closedTabs = [], groupCounter = 0, vertical = false, splitIds = null;
    let menuTabId = null, draggedId = null, dragMoved = false, toastTimeout = null;
    let contextKind = '', hasUserInteracted = false;

    // Keep an existing Lucide icon library, with the earlier inline fallbacks for offline use.
    function icons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons({ attrs: { class: 'icon', 'stroke-width': 1.8 } });
        return;
      }
      for (const el of document.querySelectorAll('[data-lucide]')) {
        const key = el.getAttribute('data-lucide');
        if (!document.getElementById('ico-' + key)) continue;
        const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        for (const [k,v] of Object.entries({ class:'icon', viewBox:'0 0 24 24', fill:'none', stroke:'currentColor','stroke-width':'1.8','stroke-linecap':'round','stroke-linejoin':'round' })) svg.setAttribute(k,v);
        const use = document.createElementNS('http://www.w3.org/2000/svg','use');
        use.setAttribute('href','#ico-'+key); svg.append(use); el.replaceWith(svg);
      }
    }
    function currentTab() { return tabs.find(t => t.id === activeId); }
    function byId(id) { return tabs.find(t => t.id === id); }
    function urlOf(tab) { return tab?.stack[tab.at] || ''; }
    function labelFor(url) { if (!url) return 'New tab'; try { return new URL(url).hostname.replace(/^www\./,''); } catch { return 'New tab'; } }
    function notify(message) {
      toast.textContent = message; toast.classList.add('visible');
      clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2800);
    }
    function makeTab(duplicate = null) {
      return duplicate ? { ...structuredClone(duplicate), id: nextId++ } : { id: nextId++, stack:[''], at:0, pinned:false, muted:false, group:0 };
    }
    function addTab({ afterId = null, duplicate = null, focus = true } = {}) {
      hideContext(); hideMenu();
      const t = makeTab(duplicate);
      const index = afterId === null ? tabs.length : Math.max(0, tabs.findIndex(x => x.id === afterId) + 1);
      tabs.splice(index, 0, t);
      activeId = t.id;
      render(); if (focus) { address.focus(); if (duplicate) address.select(); }
      return t;
    }
    function closeIds(ids, { remember = true } = {}) {
      const toClose = new Set(ids);
      const visible = tabs.filter(t => toClose.has(t.id));
      if (!visible.length) return;
      if (remember) closedTabs.push(...visible.map(t => structuredClone(t)));
      const previousPosition = Math.max(0, tabs.findIndex(t => t.id === activeId));
      tabs = tabs.filter(t => !toClose.has(t.id));
      if (splitIds && splitIds.some(id => toClose.has(id))) splitIds = null;
      if (!tabs.length) { addTab({ focus:false }); return; }
      if (!byId(activeId)) activeId = tabs[Math.min(previousPosition, tabs.length - 1)].id;
      render();
    }
    function closeTab(id = activeId) {
      const node = [...tablist.children].find(x => Number(x.dataset.id) === id);
      if (node && !noMotion()) {
        node.classList.add('is-closing');
        setTimeout(() => closeIds([id]), 125);
      } else closeIds([id]);
    }
    function reopenTab() {
      const t = closedTabs.pop(); if (!t) { notify('No recently closed tabs'); return; }
      t.id = nextId++; tabs.push(t); activeId = t.id; render();
    }
    function switchTab(id) { if (!byId(id)) return; activeId=id; hideContext(); render(); }
    function previewContent(tab) {
      const el = document.createElement('div');
      if (!urlOf(tab)) el.innerHTML = guestHtml;
      else {
        const s = document.createElement('section'); s.className='preview-state';
        const h = document.createElement('h2'); h.textContent=labelFor(urlOf(tab));
        const p = document.createElement('p'); p.textContent='This is a UI prototype. Connect Creyium’s Scramjet renderer to display the website here.';
        s.append(h,p); el.append(s);
      }
      return el;
    }
    function renderViewport(tab) {
      viewport.classList.remove('split'); viewport.replaceChildren();
      if (splitIds && splitIds.every(id => !!byId(id))) {
        viewport.classList.add('split');
        for (const id of splitIds) {
          const pane = document.createElement('section'); pane.className = 'split-pane';
          pane.setAttribute('aria-label', `Split: ${labelFor(urlOf(byId(id)))}`);
          const content = previewContent(byId(id)); pane.append(...content.childNodes);
          pane.addEventListener('pointerdown', () => { activeId = id; syncAddress(); }, { once:true });
          viewport.append(pane);
        }
      } else {
        splitIds = null;
        const content = previewContent(tab); viewport.append(...content.childNodes);
      }
    }
    function syncAddress() {
      const t = currentTab(); if (!t) return;
      address.value = urlOf(t);
      buttons.back.disabled = t.at === 0;
      buttons.forward.disabled = t.at === t.stack.length - 1;
      document.title = urlOf(t) ? `${labelFor(urlOf(t))} · Creyium` : 'New tab · Creyium';
    }
    function render() {
      if (!currentTab()) return;
      app.classList.toggle('vertical',vertical);
      tablist.replaceChildren();
      for (const t of tabs) {
        const active=t.id===activeId;
        const item=document.createElement('div');
        item.className='tab'+(active?' active':'')+(t.pinned?' pinned':'')+(t.muted?' muted':'')+(t.group?' grouped':'');
        item.dataset.id=String(t.id); item.draggable=true; item.role='tab'; item.tabIndex=active?0:-1;
        item.setAttribute('aria-selected',String(active)); item.setAttribute('aria-label',labelFor(urlOf(t)));
        item.title=labelFor(urlOf(t))+(t.group?` · Group ${t.group}`:'')+(t.muted?' (muted)':'');
        if (t.group) item.style.setProperty('--group-color',['#a9c1ff','#f8b36b','#8ee0bb','#cb9eff'][(t.group-1)%4]);
        item.innerHTML=`<span class="tab-icon"><i data-lucide="${urlOf(t)?'globe':'panel-top'}"></i></span><span class="tab-name"></span><button class="tab-close" type="button" title="Close tab" aria-label="Close tab"><i data-lucide="x"></i></button>`;
        item.querySelector('.tab-name').textContent=labelFor(urlOf(t));
        item.addEventListener('click',e=> { if (!dragMoved && !e.target.closest('.tab-close')) switchTab(t.id); });
        item.addEventListener('keydown',e=>{ if(e.target!==item)return; if(['Enter',' '].includes(e.key)){e.preventDefault();switchTab(t.id);} });
        item.querySelector('.tab-close').addEventListener('click',e=>{e.stopPropagation();closeTab(t.id);});
        item.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();switchContext('tab',e.clientX,e.clientY,t.id);});
        item.addEventListener('dragstart',e=>{
          if (e.target.closest('.tab-close')) {e.preventDefault();return;}
          draggedId=t.id; dragMoved=false; item.classList.add('is-dragging');
          e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(t.id));
        });
        item.addEventListener('dragend',()=>{
          draggedId=null; tablist.querySelectorAll('.tab').forEach(el=>el.classList.remove('is-dragging','drag-before','drag-after'));
          if(dragMoved){ tabs = [...tablist.querySelectorAll('.tab')].map(el=>byId(Number(el.dataset.id))).filter(Boolean); render(); setTimeout(()=>dragMoved=false,80); }
        });
        tablist.append(item);
      }
      syncAddress(); renderViewport(currentTab()); icons();
    }
    // Native desktop drag-and-drop: reorder actual nodes during drag, commit tab array on drop.
    tablist.addEventListener('dragover',e=>{
      if (draggedId === null)return;
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      const dragged=tablist.querySelector(`[data-id="${draggedId}"]`);
      const target=e.target.closest('.tab');
      if(!target||!dragged||target===dragged)return;
      const r=target.getBoundingClientRect();
      const before=vertical?e.clientY<r.top+r.height/2:e.clientX<r.left+r.width/2;
      if(before&&target.previousElementSibling!==dragged) {tablist.insertBefore(dragged,target);dragMoved=true;}
      else if(!before&&target.nextElementSibling!==dragged){tablist.insertBefore(dragged,target.nextSibling);dragMoved=true;}
    });
    tablist.addEventListener('drop',e=>{ if(draggedId===null)return; e.preventDefault(); tabs=[...tablist.querySelectorAll('.tab')].map(el=>byId(Number(el.dataset.id))).filter(Boolean); draggedId=null; render(); dragMoved=true; setTimeout(()=>dragMoved=false,100); });

    function navigate(raw) {
      const v=raw.trim(); if(!v)return;
      const isUrl=/^(https?:\/\/|localhost(?::\d+)?(?:\/|$)|[^\s]+\.[^\s]+$)/i.test(v);
      const target=isUrl ? (/^https?:\/\//i.test(v)?v:'https://'+v) : 'https://www.google.com/search?q='+encodeURIComponent(v);
      let parsed; try { parsed=new URL(target); } catch {notify('Invalid address');return;}
      if(!['https:','http:'].includes(parsed.protocol)) {notify('Only http and https are supported');return;}
      const t=currentTab(); t.stack.splice(t.at+1); t.stack.push(parsed.href); t.at++;
      render(); address.blur(); document.dispatchEvent(new CustomEvent('creyium:navigate',{ detail:{tabId:t.id,url:parsed.href} }));
    }
    function stepHistory(dir){const t=currentTab();const next=t.at+dir;if(next>=0&&next<t.stack.length){t.at=next;render();}}
    function reload(){
      const icon=buttons.reload.querySelector('svg');
      if(icon&&!noMotion()) icon.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:400,easing:'cubic-bezier(.2,.8,.2,1)'});
      render(); document.dispatchEvent(new CustomEvent('creyium:reload',{detail:{tabId:activeId}}));
    }
    function hideMenu(){popover.classList.remove('is-open');popover.inert=true;popover.setAttribute('aria-hidden','true');buttons.more.setAttribute('aria-expanded','false');}
    function toggleMenu(){hideContext();const open=!popover.classList.contains('is-open');popover.classList.toggle('is-open',open);popover.inert=!open;popover.setAttribute('aria-hidden',String(!open));buttons.more.setAttribute('aria-expanded',String(open));}

    const row=(label,action,key='',disabled=false)=>({label,action,key,disabled});
    const sep=()=>({separator:true});
    function menuRows(kind,id) {
      if(kind==='page')return [row('Back','back','Alt+Left arrow',buttons.back.disabled),row('Forward','forward','Alt+Right arrow',buttons.forward.disabled),row('Reload','reload','Ctrl+R'),sep(),row('Save as...','save','Ctrl+S'),row('Print...','print','Ctrl+P')];
      const t=byId(id); if(!t)return [];
      const index=tabs.findIndex(v=>v.id===id);
      return [
        row('New tab to the right','new-right'),row('Add tab to new split view','split'),row(t.group?'Remove from group':'Add tab to new group','group'),sep(),
        row('Reload','reload-tab','Ctrl+R'),row('Duplicate','duplicate'),row(t.pinned?'Unpin':'Pin','pin'),row(t.muted?'Unmute site':'Mute site','mute'),sep(),
        row(vertical?'Show tabs horizontally':'Show tabs vertically','vertical'),sep(),
        row('Close','close','Ctrl+W'),row('Close other tabs','close-others','',tabs.length===1),row('Close tabs to the right','close-right','',index===tabs.length-1)
      ];
    }
    function hideContext(){menu.classList.remove('is-open');menu.inert=true;menu.setAttribute('aria-hidden','true');}
    function switchContext(kind,x,y,id=null) {
      hideMenu(); contextKind=kind; menuTabId=id; menu.replaceChildren();
      for(const info of menuRows(kind,id)){
        if(info.separator){ const divider=document.createElement('div');divider.className='context-separator';divider.role='separator';menu.append(divider);continue;}
        const btn=document.createElement('button');btn.type='button';btn.className='context-option';btn.role='menuitem';btn.disabled=!!info.disabled;
        const txt=document.createElement('span');txt.textContent=info.label;btn.append(txt);
        if(info.key){const k=document.createElement('span');k.className='context-key';k.textContent=info.key;btn.append(k);}
        btn.addEventListener('click',()=>{hideContext();doMenu(info.action,id);});
        menu.append(btn);
      }
      menu.inert=false;menu.setAttribute('aria-hidden','false');menu.classList.add('is-open');
      const r=menu.getBoundingClientRect();
      menu.style.left=Math.max(8,Math.min(x,window.innerWidth-r.width-8))+'px';
      menu.style.top=Math.max(8,Math.min(y,window.innerHeight-r.height-8))+'px';
    }
    function savePreview() {
      const source='<!doctype html><html><head><meta charset="utf-8"><title>'+escapeText(document.title)+'</title></head><body>'+viewport.innerHTML+'</body></html>';
      const url=URL.createObjectURL(new Blob([source],{type:'text/html'}));
      const a=document.createElement('a');a.href=url;a.download='creyium-preview.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
      notify('Saved the UI preview, not the external website');
    }
    function escapeText(v){return v.replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
    function doMenu(action,id=activeId){
      const t=byId(id); const index=tabs.findIndex(x=>x.id===id);
      switch(action){
        case 'back':stepHistory(-1);break; case 'forward':stepHistory(1);break; case 'reload':reload();break;
        case 'new-right':addTab({afterId:id});break;
        case 'duplicate':if(t)addTab({afterId:id,duplicate:t,focus:false});break;
        case 'close':closeTab(id);break;
        case 'close-others':closeIds(tabs.filter(x=>x.id!==id).map(x=>x.id));break;
        case 'close-right':closeIds(tabs.slice(index+1).map(x=>x.id));break;
        case 'pin':if(t){t.pinned=!t.pinned;if(t.pinned){tabs.splice(index,1);tabs.splice(tabs.filter(x=>x.pinned).length,0,t);}render();}break;
        case 'mute':if(t){t.muted=!t.muted;render();notify(t.muted?'Tab marked as muted (UI only)':'Tab unmuted');}break;
        case 'group':if(t){t.group=t.group?0:++groupCounter;render();}break;
        case 'vertical':vertical=!vertical;render();break;
        case 'split':if(t){const copy=addTab({afterId:id,duplicate:t,focus:false});splitIds=[id,copy.id];render();}break;
        case 'reload-tab':switchTab(id);reload();break;
        case 'save':savePreview();break;
        case 'print':window.print();break;
      }
    }
    // The prototype viewport is local HTML. A future Scramjet iframe needs an explicit
    // key/context-menu event bridge; cross-origin iframe events do not bubble here.
    viewport.addEventListener('contextmenu',e=>{
      if(e.target.closest('input,textarea,[contenteditable="true"]'))return;
      e.preventDefault();switchContext('page',e.clientX,e.clientY);
    });
    document.addEventListener('pointerdown',e=>{
      hasUserInteracted=true;
      if(!menu.contains(e.target))hideContext();
      if(!popover.contains(e.target)&&!buttons.more.contains(e.target))hideMenu();
    });
    window.addEventListener('beforeunload',e=>{
      // Browsers only show their own generic text, and only after user interaction.
      if(!hasUserInteracted)return;
      e.preventDefault(); e.returnValue='';
    });
    document.addEventListener('keydown',e=>{
      const key=e.key.toLowerCase(), mod=e.ctrlKey||e.metaKey;
      if(!['shift','control','alt','meta'].includes(key))hasUserInteracted=true;
      if(key==='escape'){hideContext();hideMenu();address.blur();return;}
      if(mod&&!e.altKey){
        if(key==='l'){e.preventDefault();address.focus();address.select();return;}
        if(key==='t'&&e.shiftKey){e.preventDefault();reopenTab();return;}
        if(key==='t'){e.preventDefault();addTab();return;}
        if(key==='w'){e.preventDefault();closeTab();return;}
        if(key==='r'){e.preventDefault();reload();return;}
        if(key==='s'){e.preventDefault();savePreview();return;}
        if(key==='p'){e.preventDefault();window.print();return;}
        if(key==='tab'){e.preventDefault();const i=tabs.findIndex(t=>t.id===activeId);switchTab(tabs[(i+(e.shiftKey?tabs.length-1:1))%tabs.length].id);return;}
        if(key==='pageup'||key==='pagedown'){e.preventDefault();const i=tabs.findIndex(t=>t.id===activeId);switchTab(tabs[(i+(key==='pageup'?tabs.length-1:1))%tabs.length].id);return;}
        if(/^[1-9]$/.test(key)){e.preventDefault();switchTab(tabs[key==='9'?tabs.length-1:Math.min(Number(key)-1,tabs.length-1)].id);return;}
      }
      if(e.altKey&&!mod){
        if(key==='arrowleft'){e.preventDefault();stepHistory(-1);return;}
        if(key==='arrowright'){e.preventDefault();stepHistory(1);return;}
        // A fallback when the outer browser reserves Ctrl+T.
        if(e.shiftKey&&key==='t'){e.preventDefault();addTab();return;}
      }
      if(key==='f6'){e.preventDefault();address.focus();address.select();}
    },true);
    $('address-form').addEventListener('submit',e=>{e.preventDefault();navigate(address.value);});
    $('new-tab').addEventListener('click',()=>addTab());
    buttons.back.addEventListener('click',()=>stepHistory(-1));
    buttons.forward.addEventListener('click',()=>stepHistory(1));
    buttons.reload.addEventListener('click',reload);
    buttons.more.addEventListener('click',toggleMenu);
    popover.addEventListener('click',e=>{
      const action=e.target.closest('[data-action]')?.dataset.action;
      if(!action)return;hideMenu();
      if(action==='new')addTab();if(action==='close')closeTab();
      if(action==='reset'){tabs=[];closedTabs=[];splitIds=null;addTab({focus:false});}
      if(action==='fullscreen'){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.();}
    });
    menu.addEventListener('keydown',e=>{
      const items=[...menu.querySelectorAll('button:not(:disabled)')];const index=items.indexOf(document.activeElement);
      if(e.key==='ArrowDown'){e.preventDefault();items[(index+1)%items.length]?.focus();}
      if(e.key==='ArrowUp'){e.preventDefault();items[(index+items.length-1)%items.length]?.focus();}
    });
    addTab({focus:false});
  })();
  </script>
</body>
